# Server body shared by the HTTP and TLS servers
root /usr/share/nginx/html;
index index.html;
server_tokens off;
client_max_body_size 16k;
include /etc/nginx/snippets/security-headers.conf;

location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

location /.well-known/acme-challenge/ {
    root /var/www/certbot;
}

# Strict: 10 per minute per address, with a burst of 20, is plenty for a person and slow for a
# password guesser.
location /api/v1/auth/ {
    limit_req zone=rl_auth burst=20 nodelay;
    include /etc/nginx/snippets/proxy.conf;
}

location /api/ {
    limit_req zone=rl_api burst=200 nodelay;
    include /etc/nginx/snippets/proxy.conf;
}

# Vite fingerprints everything under /assets, so it can be cached forever.
location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location / {
    try_files $uri /index.html;
}
